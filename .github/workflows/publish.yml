name: Publish container

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "scripts/**"
      - "test/**"
      - "package*.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "scripts/**"
      - "test/**"
      - "package*.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/francisschmaltz/doordash-cli-mcp

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: doordash
          POSTGRES_PASSWORD: doordash_test
          POSTGRES_DB: doordash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doordash -d doordash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://doordash:doordash_test@127.0.0.1:5432/doordash_test
      DATABASE_SSL: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax and run tests once
        run: npm run check && npm test

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
